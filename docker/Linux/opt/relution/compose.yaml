services:
  database:
    image: postgres:18
    restart: unless-stopped
    container_name: database
    environment:
      TZ: "Europe/Berlin"
      POSTGRES_DB: "relution"
      POSTGRES_USER: "relution"
      POSTGRES_PASSWORD_FILE: "/run/secrets/postgres_password"
    secrets:
      - postgres_password
    expose:
      - '5432'
    volumes:
      - 'postgresql:/var/lib/postgresql'
    networks:
      - database

  relution:
    image: relution/relution:latest
    restart: unless-stopped
    container_name: relution
    depends_on:
      - database
    environment:
      - TZ=Europe/Berlin
    secrets:
      - postgres_password
      - system_admin_password
    expose:
      - '8080'
      - '8099'
    volumes:
      - './application.yml:/opt/relution/application.yml'
    networks:
      - reverse-proxy
      - database

  traefik:
    restart: unless-stopped
    image: traefik:${DOCKER_TRAEFIK:-latest}
    command:
      - --providers.file.directory=/opt/traefik/
      - --entryPoints.web.address=:80
      - --entryPoints.web.http.redirections.entryPoint.to=websecure
      - --entryPoints.web.http.redirections.entryPoint.scheme=https
      - --entryPoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    environment:
      TZ: "Europe/Berlin"
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./certs/letsencrypt:/letsencrypt
      - ./configs/traefik:/opt/traefik
    networks:
      - reverse-proxy
    logging:
      driver: 'json-file'
      options:
        max-size: '${DOCKER_TRAEFIK_LOGSIZE:-64m}'
        max-file: '4'
        compress: 'true'

volumes:
  postgresql:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  system_admin_password:
    file: ./secrets/system_admin_password

networks:
  reverse-proxy: {}
  database:
    internal: true
